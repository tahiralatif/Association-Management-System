name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deployment triggered by push to main"
          echo "Commit: ${{ github.sha }}"
          echo "This would SSH to the server and run:"
          echo "  cd /root/.openclaw/workspace/ams-project"
          echo "  git pull origin main"
          echo "  sudo systemctl restart ams-backend"
          echo "  sudo systemctl restart ams-frontend"
